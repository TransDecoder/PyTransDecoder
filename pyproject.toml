[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pytransdecoder"
version = "0.2.1"
description = "TransDecoder, the original Perl version ported to Python by AI/LLMs with new features integrated"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "Brian Haas, ported to python by AI/LLMs"}
]
dependencies = [
    "biopython>=1.81",
    "tqdm>=4.65",
]

[project.urls]
Homepage = "https://github.com/TransDecoder/PyTransDecoder"
Repository = "https://github.com/TransDecoder/PyTransDecoder"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "black>=23.0",
    "mypy>=1.0",
]

[project.scripts]
pytransdecoder = "pytransdecoder.cli:cli"
pyTransdecoder = "pytransdecoder.cli:pipeline_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pytransdecoder*"]

[tool.setuptools.package-data]
pytransdecoder = ["presets/*/*"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
